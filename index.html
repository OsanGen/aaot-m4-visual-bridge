<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Request Is Not Permission</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main id="demo" data-accent="mint">
    <header class="scene-header">
      <div class="scene-meta">
        <p class="illustration-note">Synthetic teaching illustration. Not a live assistant response.</p>
        <p class="scene-progress">
          <span class="scene-progress-track" aria-hidden="true"></span>
          <span id="scene-index" aria-label="Scene 1 of 7">1 / 7</span>
        </p>
      </div>
      <h1 id="scene-title" tabindex="-1">Design before use.</h1>
      <p id="slide-note" class="slide-note"></p>
    </header>

    <section id="stage" class="stage" aria-labelledby="scene-title">
      <noscript>JavaScript is required to view the seven-scene teaching illustration.</noscript>
    </section>

    <nav class="slide-controls" aria-label="Slide navigation">
      <div class="slide-controls-inner">
        <button id="previous" type="button" disabled>
          <span class="nav-arrow" aria-hidden="true">←</span> Previous
        </button>
        <button id="next" type="button">
          Next <span class="nav-arrow" aria-hidden="true">→</span>
        </button>
      </div>
    </nav>
    <p id="status" class="sr-only" role="status" aria-atomic="true"></p>
  </main>
</body>
</html>
